name: nexo
description: "Um novo projeto Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  google_sign_in: ^6.3.0
  provider: ^6.1.2
  cloud_firestore: ^4.17.5
  shared_preferences: ^2.2.3
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  flutter_quill: ^9.6.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  image: ^4.2.0
  cloud_functions: ^4.7.6
  url_launcher: ^6.3.0
  printing: ^5.13.1
  pdf: ^3.11.3
  fluttertoast: ^8.2.6
  firebase_storage: ^11.7.7
  timeago: ^3.6.1
  table_calendar: ^3.1.2
  math_expressions: ^2.6.0
  file_picker: ^8.0.6
  csv: ^6.0.0
  js: ^0.7.1
  uuid: ^4.5.1
  vector_math: ^2.1.4

dependency_overrides:
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11
  fake_cloud_firestore: ^2.5.2
  firebase_auth_mocks: ^0.13.0
  firebase_core_platform_interface: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/mind_map/
