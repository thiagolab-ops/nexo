name: nexo
description: Um aplicativo de flashcards para estudo e memorização.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  cloud_firestore: ^4.17.5
  cloud_functions: ^4.7.0
  cupertino_icons: ^1.0.2
  csv: ^5.1.1
  easy_localization: ^3.0.7
  firebase_auth: ^4.20.0
  firebase_core: ^2.32.0
  firebase_storage: ^11.7.7
  file_picker: ^6.2.1
  flutter_quill: 9.6.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  image: ^4.1.7
  intl: ^0.18.1
  math_expressions: ^2.4.0
  provider: ^6.1.2
  rxdart: ^0.27.7 # <-- PACOTE ADICIONADO AQUI
  share_plus: ^9.0.0
  table_calendar: ^3.1.2
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  uuid: ^4.3.3

dependency_overrides:
  intl: '0.18.1'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
